<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexusTactics - Modern Tic-Tac-Toe</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>



    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" hred="style.css">
    
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white relative bg-darkBg">

    <!-- Ambient background glows -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-sky-500/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-rose-500/10 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Header Navigation -->
    <header class="w-full py-4 px-4 sm:px-8 border-b border-cardBorder/60 bg-cardBg/40 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="returnToMenu()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-400 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
                    <i class="fa-solid fa-gamepad text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        NexusTactics
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-sky-500/10 text-sky-400 border border-sky-500/20 font-medium">Pro</span>
                    </h1>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Sound Toggle -->
                <button id="soundToggleBtn" onclick="toggleSound()" class="w-10 h-10 rounded-xl bg-cardBorder/60 text-gray-300 hover:text-white hover:bg-cardBorder transition-all flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-sky-500" aria-label="Toggle Sound">
                    <i id="soundIcon" class="fa-solid fa-volume-high text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-6 z-10">
        <div class="w-full max-w-md mx-auto">

            <!-- ================= START SCREEN ================= -->
            <div id="startScreen" class="bg-cardBg/80 backdrop-blur-xl border border-cardBorder rounded-3xl p-6 sm:p-8 shadow-2xl animate-fade-in flex flex-col gap-6">
                <div class="text-center space-y-2">
                    <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">TIC-TAC-TOE</h2>
                    <p class="text-xs sm:text-sm text-gray-400">Classic game. Modern experience.</p>
                </div>

                <!-- Game Mode Selection -->
                <div class="space-y-3">
                    <label class="text-xs font-semibold uppercase tracking-wider text-gray-400 block">Select Game Mode</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button onclick="setGameMode('pvc')" id="modePvcBtn" class="p-4 rounded-2xl border border-sky-500/40 bg-sky-500/10 text-white font-semibold text-sm transition-all flex items-center justify-center gap-3 shadow-md focus:outline-none focus:ring-2 focus:ring-sky-400">
                            <i class="fa-solid fa-robot text-sky-400 text-lg"></i>
                            <span>Vs Computer</span>
                        </button>
                        <button onclick="setGameMode('pvp')" id="modePvpBtn" class="p-4 rounded-2xl border border-cardBorder bg-darkBg/50 text-gray-300 hover:text-white font-semibold text-sm transition-all flex items-center justify-center gap-3 focus:outline-none focus:ring-2 focus:ring-sky-400">
                            <i class="fa-solid fa-user-group text-rose-400 text-lg"></i>
                            <span>Vs Player</span>
                        </button>
                    </div>
                </div>

                <!-- Symbol Selection (for PvC mode) -->
                <div id="symbolSelectionContainer" class="space-y-3">
                    <label class="text-xs font-semibold uppercase tracking-wider text-gray-400 block">Choose Your Symbol</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="setPlayerSymbol('X')" id="symbolXBtn" class="p-3 rounded-xl border border-sky-500 bg-sky-500/10 text-sky-400 font-bold text-sm transition-all flex items-center justify-center gap-2 focus:outline-none">
                            <i class="fa-solid fa-xmark text-lg"></i> <span>Play as X</span>
                        </button>
                        <button onclick="setPlayerSymbol('O')" id="symbolOBtn" class="p-3 rounded-xl border border-cardBorder bg-darkBg/50 text-gray-400 hover:text-rose-400 font-bold text-sm transition-all flex items-center justify-center gap-2 focus:outline-none">
                            <i class="fa-regular fa-circle text-base"></i> <span>Play as O</span>
                        </button>
                    </div>
                </div>

                <!-- Start Button -->
                <button onclick="startGame()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold text-base shadow-lg shadow-sky-500/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2 focus:outline-none focus:ring-2 focus:ring-sky-400">
                    <i class="fa-solid fa-play text-sm"></i>
                    <span>START GAME</span>
                </button>
            </div>

            <!-- ================= GAME SCREEN ================= -->
            <div id="gameScreen" class="hidden flex flex-col gap-5 animate-fade-in">
                
                <!-- Scoreboard -->
                <div class="bg-cardBg/90 backdrop-blur-xl border border-cardBorder rounded-2xl p-4 shadow-xl grid grid-cols-3 text-center items-center">
                    <div class="flex flex-col">
                        <span id="scoreXLabel" class="text-[11px] font-semibold tracking-wider text-sky-400 truncate">PLAYER X</span>
                        <span id="scoreX" class="text-xl sm:text-2xl font-extrabold text-white font-mono mt-0.5">0</span>
                    </div>
                    <div class="flex flex-col border-x border-cardBorder px-2">
                        <span class="text-[11px] font-semibold tracking-wider text-gray-400">DRAWS</span>
                        <span id="scoreDraws" class="text-xl sm:text-2xl font-extrabold text-white font-mono mt-0.5">0</span>
                    </div>
                    <div class="flex flex-col">
                        <span id="scoreOLabel" class="text-[11px] font-semibold tracking-wider text-rose-400 truncate">PLAYER O</span>
                        <span id="scoreO" class="text-xl sm:text-2xl font-extrabold text-white font-mono mt-0.5">0</span>
                    </div>
                </div>

                <!-- Game Status Banner -->
                <div class="flex items-center justify-between px-2">
                    <div class="flex items-center gap-2">
                        <span id="gameStatusBadge" class="px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase bg-sky-500/10 text-sky-400 border border-sky-500/30 flex items-center gap-2 transition-all">
                            <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse" id="statusDot"></span>
                            <span id="gameStatusText">YOUR TURN</span>
                        </span>
                    </div>
                    <button onclick="returnToMenu()" class="text-xs text-gray-400 hover:text-white px-3 py-1 rounded-lg bg-cardBorder/50 hover:bg-cardBorder transition-all flex items-center gap-1.5 focus:outline-none">
                        <i class="fa-solid fa-arrow-left"></i> Menu
                    </button>
                </div>

                <!-- Tic-Tac-Toe Board Container -->
                <div id="boardCard" class="bg-cardBg/90 backdrop-blur-xl border border-cardBorder rounded-3xl p-5 sm:p-6 shadow-2xl board-glow transition-all duration-300 relative overflow-hidden">
                    
                    <!-- 3x3 Grid -->
                    <div class="grid grid-cols-3 gap-3 aspect-square" role="grid" aria-label="Tic Tac Toe Board">
                        <!-- Cell 0 -->
                        <button onclick="handleCellClick(0)" id="cell-0" role="gridcell" aria-label="Top left cell" class="bg-darkBg/80 border border-cardBorder rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black transition-all hover:bg-cardBorder/50 hover:border-gray-700 active:scale-95 focus:outline-none focus:ring-2 focus:ring-sky-500 cursor-pointer disabled:cursor-default"></button>
                        <!-- Cell 1 -->
                        <button onclick="handleCellClick(1)" id="cell-1" role="gridcell" aria-label="Top center cell" class="bg-darkBg/80 border border-cardBorder rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black transition-all hover:bg-cardBorder/50 hover:border-gray-700 active:scale-95 focus:outline-none focus:ring-2 focus:ring-sky-500 cursor-pointer disabled:cursor-default"></button>
                        <!-- Cell 2 -->
                        <button onclick="handleCellClick(2)" id="cell-2" role="gridcell" aria-label="Top right cell" class="bg-darkBg/80 border border-cardBorder rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black transition-all hover:bg-cardBorder/50 hover:border-gray-700 active:scale-95 focus:outline-none focus:ring-2 focus:ring-sky-500 cursor-pointer disabled:cursor-default"></button>
                        
                        <!-- Cell 3 -->
                        <button onclick="handleCellClick(3)" id="cell-3" role="gridcell" aria-label="Center left cell" class="bg-darkBg/80 border border-cardBorder rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black transition-all hover:bg-cardBorder/50 hover:border-gray-700 active:scale-95 focus:outline-none focus:ring-2 focus:ring-sky-500 cursor-pointer disabled:cursor-default"></button>
                        <!-- Cell 4 -->
                        <button onclick="handleCellClick(4)" id="cell-4" role="gridcell" aria-label="Center cell" class="bg-darkBg/80 border border-cardBorder rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black transition-all hover:bg-cardBorder/50 hover:border-gray-700 active:scale-95 focus:outline-none focus:ring-2 focus:ring-sky-500 cursor-pointer disabled:cursor-default"></button>
                        <!-- Cell 5 -->
                        <button onclick="handleCellClick(5)" id="cell-5" role="gridcell" aria-label="Center right cell" class="bg-darkBg/80 border border-cardBorder rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black transition-all hover:bg-cardBorder/50 hover:border-gray-700 active:scale-95 focus:outline-none focus:ring-2 focus:ring-sky-500 cursor-pointer disabled:cursor-default"></button>
                        
                        <!-- Cell 6 -->
                        <button onclick="handleCellClick(6)" id="cell-6" role="gridcell" aria-label="Bottom left cell" class="bg-darkBg/80 border border-cardBorder rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black transition-all hover:bg-cardBorder/50 hover:border-gray-700 active:scale-95 focus:outline-none focus:ring-2 focus:ring-sky-500 cursor-pointer disabled:cursor-default"></button>
                        <!-- Cell 7 -->
                        <button onclick="handleCellClick(7)" id="cell-7" role="gridcell" aria-label="Bottom center cell" class="bg-darkBg/80 border border-cardBorder rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black transition-all hover:bg-cardBorder/50 hover:border-gray-700 active:scale-95 focus:outline-none focus:ring-2 focus:ring-sky-500 cursor-pointer disabled:cursor-default"></button>
                        <!-- Cell 8 -->
                        <button onclick="handleCellClick(8)" id="cell-8" role="gridcell" aria-label="Bottom right cell" class="bg-darkBg/80 border border-cardBorder rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black transition-all hover:bg-cardBorder/50 hover:border-gray-700 active:scale-95 focus:outline-none focus:ring-2 focus:ring-sky-500 cursor-pointer disabled:cursor-default"></button>
                    </div>
                </div>

                <!-- Action Controls -->
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="resetGame(true)" class="py-3 px-4 rounded-xl bg-cardBorder/80 hover:bg-cardBorder text-gray-300 hover:text-white font-semibold text-xs sm:text-sm transition-all flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>Reset All</span>
                    </button>
                    <button onclick="newRound()" class="py-3 px-4 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xs sm:text-sm shadow-lg shadow-sky-600/20 transition-all flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-sky-400">
                        <i class="fa-solid fa-forward"></i>
                        <span>Next Round</span>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- ================= RESULT MODAL ================= -->
    <div id="resultModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden animate-fade-in" aria-live="polite">
        <div class="bg-cardBg border border-cardBorder rounded-3xl max-w-sm w-full p-6 sm:p-8 shadow-2xl text-center space-y-5 relative">
            <div id="resultIconWrapper" class="w-16 h-16 rounded-2xl bg-sky-500/10 border border-sky-500/20 text-sky-400 text-2xl flex items-center justify-center mx-auto shadow-inner">
                <i id="resultModalIcon" class="fa-solid fa-trophy"></i>
            </div>
            
            <div class="space-y-1">
                <h3 id="resultTitle" class="text-xl sm:text-2xl font-extrabold text-white">VICTORY!</h3>
                <p id="resultSubtitle" class="text-xs sm:text-sm text-gray-400">Player X conquered the board.</p>
            </div>

            <div class="grid grid-cols-1 gap-2.5 pt-2">
                <button onclick="newRound(); closeResultModal();" class="w-full py-3.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm shadow-lg shadow-sky-600/20 transition-all flex items-center justify-center gap-2 focus:outline-none">
                    <i class="fa-solid fa-rotate-right text-xs"></i> Play Again
                </button>
                <button onclick="returnToMenu(); closeResultModal();" class="w-full py-3 rounded-xl bg-cardBorder/60 hover:bg-cardBorder text-gray-300 hover:text-white font-medium text-xs transition-all flex items-center justify-center gap-2 focus:outline-none">
                    <i class="fa-solid fa-house text-xs"></i> Main Menu
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-4 px-6 text-center text-xs text-gray-500 border-t border-cardBorder/60 bg-cardBg/20">
        <p>NexusTactics &bull; Modern Interactive Tic-Tac-Toe</p>
    </footer>

    <!-- Screen Reader Announcer -->
    <div id="srAnnouncer" class="sr-only" aria-live="assertive"></div>

    <script src="tailwind.js"></script>
    <script src="game.js"></script>
</body>
</html>
